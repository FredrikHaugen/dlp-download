name: Harbor
options:
  bundleIdPrefix: com.harborapp
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  HarborCore:
    path: .
targets:
  Harbor:
    type: application
    platform: macOS
    sources:
      - path: Sources/Harbor
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: HarborCore
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: 'Harbor contributors'
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harborapp.Harbor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Harbor.entitlements
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed download engines
        script: /usr/bin/python3 "$SRCROOT/Scripts/embed_engines.py" "$SRCROOT/Vendor/EngineSet" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        basedOnDependencyAnalysis: false
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    run:
      config: Debug
    archive:
      config: Release
