name: Review upstream engine availability
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned yt-dlp with upstream
        run: python3 Scripts/check_upstream.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-engine-status
          path: build/upstream-status.json
